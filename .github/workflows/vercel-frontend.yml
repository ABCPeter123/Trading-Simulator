name: Validate Vercel static frontend and private connection

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "vercel.json"
      - "scripts/vercel-frontend-smoke.mjs"
      - ".github/workflows/vercel-frontend.yml"
  pull_request:
    paths:
      - "src/**"
      - "vercel.json"
      - "scripts/vercel-frontend-smoke.mjs"
      - ".github/workflows/vercel-frontend.yml"

jobs:
  static-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node and Chromium
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Build exact Vercel frontend mode
        env:
          VITE_CLOUD_FRONTEND: '1'
        run: npm run build
      - name: Verify no backend on Vercel and authenticated connection workflow
        run: |
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/vercel-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/vercel-frontend-smoke.mjs
