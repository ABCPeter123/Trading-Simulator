name: Block private strategy and trading-data leaks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  private-artifact-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify privacy detection including forced Git adds
        run: python -m unittest -q scripts.test_private_artifacts
      - name: Refuse private strategy artifacts and credentials in tracked files
        run: python scripts/check_private_artifacts.py --staged
