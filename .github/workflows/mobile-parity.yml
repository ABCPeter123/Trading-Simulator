name: Validate desktop and mobile feature parity
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/mobile-parity.mjs"
      - ".github/workflows/mobile-parity.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/mobile-parity.mjs"
      - ".github/workflows/mobile-parity.yml"

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app and browser test runner
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify phone, tablet, and desktop features
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/trading-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill $VITE_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/mobile-parity.mjs
